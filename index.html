<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Novedades Fátima</title>
<meta name="theme-color" content="#122a54">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #122a54;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    color: #ffffff;
  }
  .wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  img { width: 88px; height: 88px; border-radius: 18px; margin-bottom: 20px; }
  p { opacity: 0.85; margin: 6px 0 22px; }
  a.btn {
    display: inline-block;
    background: #ffffff;
    color: #122a54;
    text-decoration: none;
    font-weight: 600;
    padding: 12px 22px;
    border-radius: 10px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <img src="icon-192.png" alt="Novedades Fátima">
    <p>Abriendo Novedades Fátima…</p>
    <a class="btn" href="https://script.google.com/macros/s/AKfycbx9BaOgR6eO_3fFUKaMV_MhokAB5jY0rD6BduSDcefdzttoDfAinkf-Ded_R7BDDMpW/exec" id="fallback">
      Si no se abre solo, tocá acá
    </a>
  </div>

<script>
  var DESTINO = "https://script.google.com/macros/s/AKfycbx9BaOgR6eO_3fFUKaMV_MhokAB5jY0rD6BduSDcefdzttoDfAinkf-Ded_R7BDDMpW/exec";

  // Redirige apenas carga la página.
  window.location.replace(DESTINO);

  // Por si el navegador bloquea el replace inmediato, reintenta un momento después.
  setTimeout(function () {
    window.location.href = DESTINO;
  }, 800);

  // Service worker vacío: ayuda a que Chrome ofrezca "Instalar aplicación"
  // en algunos dispositivos/versiones que todavía lo piden como requisito.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
</script>
</body>
</html>
